<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151515">

  <meta name="description" content="Biblioteca Formação Esquerda Radical — formação marxista e estudo político.">

  <title>Formação Política — Ismael Araújo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/main.js" defer></script>

  <style>
    /* A página inteira ocupa a janela */
    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }

    body.formation-page {
      display: flex;
      flex-direction: column;
      background: #191919;
    }

    /* Cabeçalho original do site */
    .formation-page .site-header {
      flex-shrink: 0;
    }

    /* Área principal sem rolagem externa */
    .formation-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Breadcrumb */
    .formation-breadcrumb {
      flex-shrink: 0;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    /* Área da biblioteca */
    .formation-container {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: #191919;
    }

    .formation-container iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #191919;
    }

    /* Marca d'água própria */
    .formation-watermark {
        position: absolute;
        z-index: 10;
        bottom: 20px;
        left: 17.15%;
        transform: translateX(-50%);

        display: flex;
        align-items: center;
        gap: .65rem;

        padding: .55rem 1.1rem;
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 999px;

        background: rgba(25, 25, 25, .88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);

        color: #aaa;
        text-decoration: none;
        font-family: 'DM Mono', monospace;
        font-size: .65rem;
        letter-spacing: .04em;

        white-space: nowrap;
        transition: border-color .2s ease, background .2s ease;
    }

    .formation-watermark:hover {
        border-color: rgba(213, 163, 91, .55);
        background: rgba(30, 30, 30, .96);
    }

    .formation-watermark .watermark-logo {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #f2f0e9;
        letter-spacing: -.08em;
    }

    .formation-watermark .watermark-logo span {
        color: #d5a35b;
    }

    .formation-watermark:hover {
      opacity: 0.99;
    }

    @media (max-width: 768px) {
      .formation-breadcrumb {
        padding-top: 0.7rem;
        padding-bottom: 0.7rem;
      }

      .formation-watermark {
        padding: 0.30rem 1.0rem;
        font-size: 0.58rem;
      }
    }
  </style>
</head>

<body class="inner-page formation-page">

  <header class="site-header">

    <a class="brand" href="../index.html"
       aria-label="Ismael Araújo — início">
      <span class="brand-mark">IA<span>.</span></span>

      <span class="brand-name">
        ISMAEL ARAÚJO<br>
        <small>ARQUIVO PESSOAL / 001</small>
      </span>
    </a>

    <!-- NAVEGAÇÃO -->
    <div class="inner-breadcrumb mono section-shell formation-breadcrumb">

      <a href="../index.html">INÍCIO</a>
      <span>/</span>
      <a href="politica.html">POLÍTICA</a>
      <span>/</span>
      <span>FORMAÇÃO</span>

    </div>

    <button class="menu-toggle" type="button"
            aria-expanded="false"
            aria-controls="primary-nav">
      <span class="menu-toggle-label">MENU</span>
      <span class="menu-icon" aria-hidden="true">
        <i></i><i></i>
      </span>
    </button>

    <nav class="primary-nav" id="primary-nav"
         aria-label="Navegação principal">
      <a href="cbmce.html">CBMCE <span>01</span></a>
      <a href="politica.html" aria-current="page">
        Política <span>02</span>
      </a>
      <a href="sobre.html">Sobre <span>03</span></a>
    </nav>

  </header>

  <main class="formation-main" id="conteudo">



    <!-- BIBLIOTECA INCORPORADA -->
    <section class="formation-container">

      <iframe
        src="https://unaware-warbler.super.site/"
        title="Biblioteca Formação Esquerda Radical"
        loading="eager"
        allowfullscreen>
      </iframe>

      <!-- IDENTIDADE VISUAL PRÓPRIA -->
      <a href="../index.html"
         class="formation-watermark"
         aria-label="Voltar ao arquivo pessoal de Ismael Araújo">

        <span class="watermark-logo">IA<span>.</span></span>
        <span>ARQUIVO PESSOAL</span>

      </a>

    </section>

  </main>

</body>
</html>
