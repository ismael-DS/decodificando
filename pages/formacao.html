<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151515">

  <meta name="description" content="Biblioteca Formação Esquerda Radical — formação marxista e estudo político.">

  <title>Formação Política — Ismael Araújo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/main.js" defer></script>

  <style>
    /* ========================================
       ESTRUTURA GERAL
    ======================================== */

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }

    body.formation-page {
      display: flex;
      flex-direction: column;
      background: #191919;
    }


    /* ========================================
       CABEÇALHO COMPACTO
    ======================================== */

    .formation-page .site-header {
      flex-shrink: 0;
      min-height: 0;
      padding-top: .4rem;
      padding-bottom: .4rem;
    }

    /* Preserva o funcionamento do menu original */
    .formation-page .menu-toggle {
      flex-shrink: 0;
    }

    .formation-page .primary-nav {
      z-index: 1000;
    }


    /* ========================================
       ÁREA PRINCIPAL
    ======================================== */

    .formation-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ========================================
       IFRAME / BIBLIOTECA
    ======================================== */

    .formation-container {
      position: relative;
      isolation: isolate;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: #191919;
    }

    .formation-container iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #191919;
    }


    /* ========================================
       MARCA D'ÁGUA PERSONALIZADA
    ======================================== */

    .formation-watermark {
      position: absolute;
      z-index: 99999;

      /* Posicionamento sobre a marca original */
      bottom: 20px;
      left: 36px;

      /* Dimensões da cápsula */
      width: 190px;
      height: 42px;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;

      padding: 0 .7rem;

      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;

      background: #191919;
      color: #aaa;

      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: .55rem;
      letter-spacing: .035em;
      white-space: nowrap;

      box-shadow: 0 2px 10px rgba(0, 0, 0, .2);

      transition:
        border-color .2s ease,
        background .2s ease;
    }

    .formation-watermark:hover {
      border-color: rgba(213, 163, 91, .55);
      background: #202020;
    }

    .formation-watermark .watermark-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #f2f0e9;
      letter-spacing: -.08em;
    }

    .formation-watermark .watermark-logo span {
      color: #d5a35b;
    }


    /* ========================================
       RESPONSIVIDADE
    ======================================== */

    @media (max-width: 768px) {

      .formation-page .site-header {
        padding-top: .35rem;
        padding-bottom: .35rem;
      }

      .formation-breadcrumb {
        padding-top: .35rem;
        padding-bottom: .35rem;
        font-size: .55rem;
      }

      .formation-watermark {
        left: 0;
        bottom: 20px;

        width: 200px;
        height: 40px;

        font-size: .53rem;
      }

      .formation-watermark .watermark-logo {
        font-size: .95rem;
      }
    }

  </style>
</head>

<body class="inner-page formation-page">

  <!-- CABEÇALHO -->
  <header class="site-header">

    <a class="brand" href="../index.html"
       aria-label="Ismael Araújo — início">

      <span class="brand-mark">IA<span>.</span></span>

      <span class="brand-name">
        ISMAEL ARAÚJO<br>
        <small>ARQUIVO PESSOAL / 001</small>
      </span>

    </a>

    <!-- BOTÃO DO MENU -->
    <button class="menu-toggle" type="button"
            aria-expanded="false"
            aria-controls="primary-nav">

      <span class="menu-toggle-label">MENU</span>

      <span class="menu-icon" aria-hidden="true">
        <i></i>
        <i></i>
      </span>

    </button>

    <!-- NAVEGAÇÃO -->
    <nav class="primary-nav" id="primary-nav"
         aria-label="Navegação principal">

      <a href="cbmce.html">
        CBMCE <span>01</span>
      </a>

      <a href="politica.html">
        Política <span>02</span>
      </a>

      <a href="sobre.html">
        Sobre <span>03</span>
      </a>

    </nav>

  </header>


  <!-- CONTEÚDO PRINCIPAL -->
  <main class="formation-main" id="conteudo">

    <!-- BIBLIOTECA INCORPORADA -->
    <section class="formation-container">

      <iframe
        src="https://unaware-warbler.super.site/"
        title="Biblioteca Formação Esquerda Radical"
        loading="eager"
        allowfullscreen>
      </iframe>


      <!-- MARCA D'ÁGUA PERSONALIZADA -->
      <a href="formacao.html"
         class="formation-watermark"
         aria-label="Voltar ao arquivo pessoal de Ismael Araújo">

        <span class="watermark-logo">IA<span class="status-dot"></span></span>

        <span>Praxis</span>

      </a>

    </section>

  </main>

</body>
</html>
